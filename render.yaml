services:
  - type: web
    name: zerodha-clone-platform
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix dashboard && REACT_APP_GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" REACT_APP_APPLE_CLIENT_ID="$APPLE_CLIENT_ID" npm run build --prefix dashboard
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false

  - type: web
    name: zerodha-clone-landing
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_DASHBOARD_URL
        fromService:
          type: web
          name: zerodha-clone-platform
          envVarKey: RENDER_EXTERNAL_URL
